<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="System Architecture">
  <style>
    .title { font: 700 28px system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .label { font: 16px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#111 }
    .sub   { font: 13px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#333 }
    .box   { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2 }
    .pill  { fill:#eef2ff; stroke:#a5b4fc }
    .chain { fill:#ecfeff; stroke:#67e8f9 }
    .arrow { stroke:#64748b; stroke-width:2; marker-end:url(#m) }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="30" y="40" class="title">zktrust-llm: Phase-1/2 Architecture</text>

  <!-- Clients -->
  <rect class="box" x="40" y="90" width="300" height="180" rx="14"/>
  <text class="label" x="60" y="120">Clients / Raters</text>
  <text class="sub" x="60" y="145">• Submit feedback (score, reveal flag)</text>
  <text class="sub" x="60" y="170">• Provide human judgments</text>
  <text class="sub" x="60" y="195">• (opt) Evidence URIs</text>

  <!-- Phase 1 -->
  <rect class="box" x="400" y="90" width="340" height="180" rx="14"/>
  <text class="label" x="420" y="120">Phase-1 (ReputationBasic / WithZK)</text>
  <text class="sub" x="420" y="145">• Aggregate feedback (public/private)</text>
  <text class="sub" x="420" y="170">• Reputation = average × 100 (x100)</text>
  <text class="sub" x="420" y="195">• Events: FeedbackSubmitted</text>

  <!-- Chain -->
  <rect class="chain" x="780" y="90" width="360" height="180" rx="14"/>
  <text class="label" x="800" y="120">Ethereum (local devnet)</text>
  <text class="sub" x="800" y="145">• Stores reputations, events</text>
  <text class="sub" x="800" y="170">• Verifier (mock) for ZK flow</text>
  <text class="sub" x="800" y="195">• Access control for oracle</text>

  <!-- Oracle -->
  <rect class="pill" x="400" y="320" width="340" height="180" rx="14"/>
  <text class="label" x="420" y="350">Oracle (admin account)</text>
  <text class="sub" x="420" y="375">• Submits Phase-2 KPIs</text>
  <text class="sub" x="420" y="400">• autoScore, humanScore, weight</text>
  <text class="sub" x="420" y="425">• evidenceURI (dataset, notes)</text>

  <!-- Phase 2 -->
  <rect class="box" x="780" y="320" width="360" height="180" rx="14"/>
  <text class="label" x="800" y="350">Phase-2 (LLMReputation)</text>
  <text class="sub" x="800" y="375">• Event: ScoresSubmitted</text>
  <text class="sub" x="800" y="400">• Reputation update + daily decay</text>
  <text class="sub" x="800" y="425">• Model registration & ownership</text>

  <!-- Arrows -->
  <line class="arrow" x1="340" y1="180" x2="400" y2="180"/>
  <line class="arrow" x1="740" y1="180" x2="780" y2="180"/>
  <line class="arrow" x1="570" y1="270" x2="570" y2="320"/>
  <line class="arrow" x1="740" y1="410" x2="780" y2="410"/>
</svg>
