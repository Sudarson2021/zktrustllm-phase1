<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Success vs Failure by Model">
  <style>
    .h1 { font: 700 28px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .axis { font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#333 }
    .tick { stroke:#ccc; stroke-width:1 }
    .bar-success { fill:#2ca02c }  /* green */
    .bar-failure { fill:#d62728 }  /* red */
    .label { font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#111 }
    .caption { font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#444 }
    .legend { font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill:#111 }
  </style>

  <text x="30" y="40" class="h1">Phase-2 Model Performance Matrix — Success vs. Failure</text>

  <!-- y grid/axis 0..100 -->
  <g transform="translate(90,70)">
    <!-- y ticks -->
    <g class="axis">
      <line class="tick" x1="0" x2="1000" y1="0" y2="0"/>
      <line class="tick" x1="0" x2="1000" y1="100" y2="100"/>
      <line class="tick" x1="0" x2="1000" y1="200" y2="200"/>
      <line class="tick" x1="0" x2="1000" y1="300" y2="300"/>
      <line class="tick" x1="0" x2="1000" y1="400" y2="400"/>
      <!-- y labels -->
      <text x="-50" y="400" alignment-baseline="middle">0%</text>
      <text x="-58" y="300" alignment-baseline="middle">25%</text>
      <text x="-58" y="200" alignment-baseline="middle">50%</text>
      <text x="-58" y="100" alignment-baseline="middle">75%</text>
      <text x="-58" y="0"   alignment-baseline="middle">100%</text>
    </g>

    <!-- Bars: each 260px wide, 140px gap -->
    <!-- Values: success=92% (height 368), failure=8% (height 32); base at y=400 -->
    <!-- Model 1 -->
    <g transform="translate(40,0)">
      <rect class="bar-success" x="0"   y="32"  width="260" height="368" rx="6"/>
      <rect class="bar-failure" x="0"   y="400" width="260" height="32"  rx="0" transform="translate(0,-32)"/>
      <text class="label" x="130" y="430" text-anchor="middle">Model 1</text>
      <text class="label" x="130" y="20"  text-anchor="middle">Success 92%</text>
      <text class="label" x="130" y="395" text-anchor="middle">Failure 8%</text>
    </g>

    <!-- Model 2 -->
    <g transform="translate(440,0)">
      <rect class="bar-success" x="0"   y="32"  width="260" height="368" rx="6"/>
      <rect class="bar-failure" x="0"   y="400" width="260" height="32"  rx="0" transform="translate(0,-32)"/>
      <text class="label" x="130" y="430" text-anchor="middle">Model 2</text>
      <text class="label" x="130" y="20"  text-anchor="middle">Success 92%</text>
      <text class="label" x="130" y="395" text-anchor="middle">Failure 8%</text>
    </g>

    <!-- Model 3 -->
    <g transform="translate(840,0)">
      <rect class="bar-success" x="0"   y="32"  width="260" height="368" rx="6"/>
      <rect class="bar-failure" x="0"   y="400" width="260" height="32"  rx="0" transform="translate(0,-32)"/>
      <text class="label" x="130" y="430" text-anchor="middle">Model 3</text>
      <text class="label" x="130" y="20"  text-anchor="middle">Success 92%</text>
      <text class="label" x="130" y="395" text-anchor="middle">Failure 8%</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(920,52)">
    <rect width="16" height="16" class="bar-success" rx="3"/>
    <text class="legend" x="24" y="13">Success</text>
    <rect width="16" height="16" class="bar-failure" rx="3" y="24"/>
    <text class="legend" x="24" y="37">Failure</text>
  </g>

  <!-- Caption -->
  <text x="30" y="480" class="caption">
    Success ≈ automated score; failure = 100 − success. Inputs from on-chain Phase-2 submission; raw in docs/assets/phase2_models.csv.
  </text>
</svg>
